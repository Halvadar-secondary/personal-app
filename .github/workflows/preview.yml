name: preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  playwright:
    needs: checks
    runs-on: ubuntu-latest
    env:
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      E2E_INTRUDER_EMAIL: ${{ secrets.E2E_INTRUDER_EMAIL }}
      E2E_INTRUDER_PASSWORD: ${{ secrets.E2E_INTRUDER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # This PR's own database: a copy of `seed`, never of production.
      - id: branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: pr-${{ github.event.number }}
          parent_branch: seed
          api_key: ${{ secrets.NEON_API_KEY }}
      - id: db
        name: Reset branch to seed
        uses: neondatabase/reset-branch-action@v1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: pr-${{ github.event.number }}
          parent: true
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Migrate
        run: pnpm db:migrate
        env:
          MIGRATION_DATABASE_URL: ${{ steps.db.outputs.db_url }}
      - name: Provision test users
        run: pnpm e2e:users
        env:
          MIGRATION_DATABASE_URL: ${{ steps.db.outputs.db_url }}

      # The app runs here, on the runner: a Vercel preview per PR used up the
      # Vercel account's free CPU allowance (2026-11-05).
      - name: Build
        run: pnpm build
        env:
          APP_ENV: preview
          APP_BUILD_ID: ${{ github.sha }}
          BETTER_AUTH_URL: build-time-placeholder
      - name: Start the app
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "schema=$(node -p "require('./drizzle/meta/_journal.json').entries.length")" >> "$GITHUB_OUTPUT"
        id: app
      - run: nohup pnpm start > app.log 2>&1 &
        env:
          APP_ENV: preview
          APP_BUILD_ID: ${{ github.sha }}
          BETTER_AUTH_URL: http://localhost:3000
          DATABASE_URL: ${{ steps.db.outputs.db_url_with_pooler }}
          OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          ENABLE_PASSWORD_LOGIN: "true"
      - name: Check the app is a preview
        run: >
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors -o /dev/null http://localhost:3000/api/health &&
          pnpm smoke http://localhost:3000 --env preview --build "${{ github.sha }}"
          --schema "${{ steps.app.outputs.schema }}"

      - run: pnpm exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:3000
          # Lets the chat tests that store a conversation run too.
          DATABASE_URL: ${{ steps.db.outputs.db_url_with_pooler }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            app.log
          retention-days: 7
