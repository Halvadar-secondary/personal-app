name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  migrate:
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Migrate production
        run: pnpm db:migrate
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.PROD_MIGRATION_DATABASE_URL }}
      - name: Migrate seed (so new PR branches start current)
        run: pnpm db:migrate
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.SEED_MIGRATION_DATABASE_URL }}

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build
        run: |
          pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          APP_BUILD_ID="${{ github.sha }}" pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"
      # Deploy without taking the domain, prove that exact deployment, then promote it.
      # A failed check never serves traffic, so there is no automatic rollback (which would
      # also pin the domain and make every later deploy fail). Manual undo: `vercel rollback`.
      - name: Deploy (not yet live)
        id: deploy
        run: |
          url=$(pnpm dlx vercel@latest deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "schema=$(node -p "require('./drizzle/meta/_journal.json').entries.length")" >> "$GITHUB_OUTPUT"
      - name: Smoke the new deployment
        run: >
          pnpm smoke "${{ steps.deploy.outputs.url }}" --env production --build "${{ github.sha }}"
          --schema "${{ steps.deploy.outputs.schema }}" --expect-no-password
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Promote
        # REST, not `vercel promote`: the CLI first loads the token's user, which a
        # team-scoped token can't (404 "User not found").
        run: |
          api=https://api.vercel.com
          auth="Authorization: Bearer $VERCEL_TOKEN"
          host="${DEPLOY_URL#https://}"
          id=$(curl -fsS -H "$auth" "$api/v13/deployments/$host?teamId=$VERCEL_ORG_ID" | jq -r .id)
          curl -fsS -X POST -H "$auth" "$api/v10/projects/$VERCEL_PROJECT_ID/promote/$id?teamId=$VERCEL_ORG_ID" > /dev/null
          echo "promoted $id"
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
      - name: Smoke production
        run: >
          pnpm smoke "${{ vars.PROD_URL }}" --env production --build "${{ github.sha }}"
          --schema "${{ steps.deploy.outputs.schema }}" --expect-no-password
